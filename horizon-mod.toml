id = "industrialforegoing"
name = "Industrial Foregoing"
version = "0.2.15"
description = """A port of Industrial Foregoing for Horizon: the Water Condensator, a machine that condenses water out
of the water source blocks beside it, for Forge Energy. Its 10,000 FE buffer feeds a 16,000 mB drain-only
water tank through a bar that counts down each tick: two or more sources beside it give 100 mB a source for
1,000 FE, and the same sources give 50 mB a source for free when the buffer holds less. Two
`titanium:augments` slots take the parent's speed and efficiency addons: a speed addon makes the bar fall
faster and an efficiency one shortens it. The Core item set ships with it: the four machine frames, the
iron, gold and diamond gears, plastic and the 16 coloured laser lenses, with the tags the pack's add-ons
bind to (`c:gears/*`, `c:plastics`, `industrialforegoing:machine_frame/*`), so the condensator's own recipe
names them again. The Dissolution Chamber ships with its own recipe type: eight input slots, three output slots, an
8,000 mB input tank and a 16,000 mB output tank of this mod's own fluids, a 10,000 FE buffer and 90 FE
a tick, running the 23 of the jar's own chamber recipes whose products this package makes (the simple,
advanced and supreme machine frames, the 16 coloured laser lenses and the four addon items). The
latex chain ships with it: a Fluid Extractor draws latex out of the log behind it (a bar of 100 ticks,
500 FE an operation, a 1,000 mB tank) and its own recipe type carries the jar's nine log recipes, and a
Latex Processing Unit turns 750 mB of latex and 500 mB of water into dry rubber for 20 FE a tick, which
a furnace smelts into plastic. The laser drill and its ore base ship with their own recipe type
(`industrialforegoing:laser_drill_ore`): the drill charges the base one bar step per 1,000 FE, the base
picks a weighted recipe by the biome tags and dimension type at its mining depth (ten of the jar's
recipes, the ones whose ores vanilla or this package has), six lens slots raise a recipe's weight and
fifteen output slots hold the ore. A fluid laser base ships beside it, under its own type
(`industrialforegoing:laser_drill_fluid`): one lens slot, a 32,000 mB drain-only tank and no FE of its
own, the first file-order recipe whose catalyst, biome/depth/dimension rarity and nearby-entity gate
pass filling the tank with lava, a pack's oil or this mod's ether gas (the jar's three files). The mob
slaughter factory ships beside the pink slime set: a bar of 100 ticks, a 10,000 FE buffer at 400 FE an
operation, a working area of the block behind it expanded two blocks up, and the first mob there killed
for its health in an 8,000 mB meat tank and an 8,000 mB pink slime tank (an animal's health is meat and
twenty times that in pink slime; anything else the other way round). The pink slime item, its ingot and
the pink slime block ship with their recipes and tags, and the dissolution chamber runs the jar's only
`outputFluid` recipe — a glass pane and 300 mB of pink slime for a pink slime ball and 150 mB of water.
The animal rancher ships with it: a bar of 100 ticks, a 10,000 FE buffer at 400 FE an operation, an
8,000 mB milk tank and a 15-slot output container, working on the single block behind it — a sheep is
sheared for 1-3 wool of its colour and left bare, a cow or a goat fills the tank with 1,000 mB of milk,
and a squid drops a black dye on its four draws with a free output slot. The sewage chain ships with it:
a Sewer counts the animals in the block above and fills a drain-only 8,000 mB
`industrialforegoing:sewage` tank with 50 mB each (a 100-tick bar, 10 FE times animals plus one, a
10,000 FE buffer), and a Sewage Composter turns 1,000 mB of sewage into one
`industrialforegoing:fertilizer` in a 12-slot output container over 100 ticks at 40 FE a tick. The
Plant Fertilizer consumes one of them: an 18-slot input, a 10,000 FE buffer and a 50-tick bar that
bonemeals the single block behind it, spending 1,000 FE and resting 12 ticks while the crop can
still grow (25 when it is finished). The rest of the mod (the generators, conveyors and the other
machines) is not ported yet."""
authors = ["Buuz135", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins, beside the
# content this one also carries (assets/industrialforegoing, data/industrialforegoing). The id is the
# resource namespace and the only identity: Cargo's package name and version are not the mod's.
api = "0.2"
# The installation side, not the hooks': an integrated server belongs to the client installation, so
# single player and a LAN host need both.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity types"):
# this mod does add a block, a block entity type and a creative tab.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
