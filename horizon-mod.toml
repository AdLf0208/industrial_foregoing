id = "industrialforegoing"
name = "Industrial Foregoing"
version = "0.2.6"
description = """A port of Industrial Foregoing for Horizon: the Water Condensator, a machine that condenses water out
of the water source blocks beside it, for Forge Energy. Its 10,000 FE buffer feeds a 16,000 mB drain-only
water tank through a bar that counts down each tick: two or more sources beside it give 100 mB a source for
1,000 FE, and the same sources give 50 mB a source for free when the buffer holds less. Two
`titanium:augments` slots take the parent's speed and efficiency addons: a speed addon makes the bar fall
faster and an efficiency one shortens it. The Core item set ships with it: the four machine frames, the
iron, gold and diamond gears, plastic and the 16 coloured laser lenses, with the tags the pack's add-ons
bind to (`c:gears/*`, `c:plastics`, `industrialforegoing:machine_frame/*`), so the condensator's own recipe
names them again. The Dissolution Chamber ships with its own recipe type: eight input slots, three output slots, an
8,000 mB input tank and a 16,000 mB output tank of this mod's own fluids, a 10,000 FE buffer and 90 FE
a tick, running the 23 of the jar's own chamber recipes whose products this package makes (the simple,
advanced and supreme machine frames, the 16 coloured laser lenses and the four addon items). The
latex chain ships with it: a Fluid Extractor draws latex out of the log behind it (a bar of 100 ticks,
500 FE an operation, a 1,000 mB tank) and its own recipe type carries the jar's nine log recipes, and a
Latex Processing Unit turns 750 mB of latex and 500 mB of water into dry rubber for 20 FE a tick, which
a furnace smelts into plastic. The rest of the mod (the generators, conveyors and laser drills) is not
ported yet."""
authors = ["Buuz135", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins, beside the
# content this one also carries (assets/industrialforegoing, data/industrialforegoing). The id is the
# resource namespace and the only identity: Cargo's package name and version are not the mod's.
api = "0.2"
# The installation side, not the hooks': an integrated server belongs to the client installation, so
# single player and a LAN host need both.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity types"):
# this mod does add a block, a block entity type and a creative tab.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
