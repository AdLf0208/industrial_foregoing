[package]
# Ported from Industrial Foregoing 1.21-3.6.39 (Buuz135/Industrial-Foregoing, MIT),
# Minecraft Java 1.21.1 NeoForge; the port targets Horizon 26.3 at the pin in
# horizon-mod.toml. Clean-room Rust rewrite from the mod's behaviour (FINDINGS.md);
# local-only until publishing is approved (ARCHITECTURE.md §8), publishable under MIT
# with this source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "industrialforegoing"
version = "0.2.7"
edition = "2024"
license = "MIT"
description = "Industrial Foregoing for Horizon: the Water Condensator, the Dissolution Chamber, the latex chain, the laser drill and the Core item set"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command
# (the launcher builds against its own copy of the same build). Any other registry dependency
# must be pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
